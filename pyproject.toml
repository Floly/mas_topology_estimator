[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-poc"
version = "0.1.0"
description = "PoC: does MAS topology structure predict task accuracy?"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "networkx>=3.0",
    "numpy>=1.26",
    "datasets>=2.18",
    "scipy>=1.12",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.20",
]

[tool.setuptools]
packages = ["topologies", "mas", "metrics"]
